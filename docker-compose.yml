# freebuff-proxy — 一键部署（保持轻量）
#   docker compose up -d（自动拉取 GHCR 预构建镜像，无需本地构建）
# 数据全部落在 ./data（容器内 /data），删除容器不丢数据。
#
# host 网络（Docker 官方推荐方案，解决"容器访问宿主机 127.0.0.1 代理"）：
#   - 容器与宿主机共享网络栈，本机代理在控制台「代理设置」里直接填 http://127.0.0.1:<端口>
#   - host 模式下不要写 ports（官方文档：会被忽略并告警）；应用直接监听宿主 0.0.0.0:<PORT>
services:
  freebuff-proxy:
    # 本地构建：为了让 src/upstream/client.js 的登录重试补丁生效，改用 build: .
    # Dockerfile 的 COPY . . 会把 cli-bridge/bun 一起烘进镜像
    # （.dockerignore 已排除 data/ 与 credentials，凭据不会进镜像）。
    build: .
    container_name: freebuff-proxy
    restart: unless-stopped
    network_mode: host
    environment:
      FREEBUFF_PROXY_DATA_DIR: /data
      FREEBUFF_PROXY_CONFIG: /data/config.yaml
      FREEBUFF_PROXY_HOST: 0.0.0.0
      FREEBUFF_PROXY_PORT: "${PORT:-8787}"
      # 首次启动管理员（不设则随机生成，打印在 docker compose logs 里）
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 上游代理：在控制台「代理设置」里配置（存 /data/proxies.json），无需改这里
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,172.16.0.0/12}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 宿主机 ./data → 容器 /data（凭据/配置/用户/会话/代理设置都在这）
      - ./data:/data
      # 官方客户端 AppImage 里提取的 bun（1.4.2）→ bridge.mjs 解析优先级 #2（本目录 ./bun）
      # 预构建镜像不含此二进制（79MB 不入 git），本地用 tools/fetch-bun.sh 取得
      - ./cli-bridge/bun:/app/cli-bridge/bun:ro
